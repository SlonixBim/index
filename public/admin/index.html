<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Inject Custom CMS Dashboard Styling -->
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- Include the script that allows Netlify Identity to work properly -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
    
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <!-- Inject Tailwind CSS into the Decap CMS Preview Pane -->
    <script>
      CMS.registerPreviewStyle("https://cdn.tailwindcss.com", { raw: false });
    </script>
    
    <!-- Load custom preview template -->
    <script src="/admin/preview.js"></script>
  </body>
</html>
